[package]
name = "taskboard"
version = "0.1.0"
description = "Markdown-first task board"
authors = ["Rancorous Games"]
edition = "2021"

[lib]
name = "taskboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
task-core = { path = "../packages/task-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 16
lto = false
opt-level = 3
panic = "abort"
strip = true
