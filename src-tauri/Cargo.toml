[package]
name = "taskboard"
version = "0.1.0"
description = "Markdown-first task board"
authors = ["Rancorous Games"]
edition = "2021"

# A standalone release MUST embed its frontend assets.
# Cargo release builds without Tauri's custom-protocol serve localhost:1420
# and show ERR_CONNECTION_REFUSED when no development server is running.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "taskboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
task-core = { path = "../packages/task-core" }
taskboard-cli = { path = "../packages/task-cli" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", features = ["json", "query"] }
base64 = "0.22"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

[profile.release]
codegen-units = 16
lto = false
opt-level = 3
panic = "abort"
strip = true
